<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Перевірка імені користувача</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    label {
      font-size: 18px;
    }
    input {
      width: 300px;
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>


  <p>Введіть своє ім’я (цифри не допускаються):</p>
  <input type="text" id="userName" placeholder="Введіть ім’я">

  <script>
    const input = document.getElementById('userName');

    input.addEventListener('input', function() {
      // Видаляємо всі цифри з введеного тексту
      this.value = this.value.replace(/[0-9]/g, '');
    });
  </script>

</body>
</html>
