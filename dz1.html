<!DOCTYPE html>
<html>
<head>
    <title>Movie Search</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
        h1 { margin-bottom: 20px; }
        .form { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        input, select, button { padding: 8px; font-size: 14px; }
        .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .movie { background: white; border: 1px solid #ccc; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .movie img { width: 100%; height: 260px; object-fit: cover; background: #eee; }
        .movie-title { font-weight: bold; }
        .status { margin-bottom: 10px; color: #666; }
        .controls { margin-top: 16px; display: flex; align-items: center; gap: 10px; }
        .spinner { width: 18px; height: 18px; border: 2px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .details { margin-top: 24px; padding: 16px; background: #fff; border: 1px solid #ccc; }
        .hidden { display: none; }
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; }
        .modal { background: #fff; width: min(680px, 92vw); max-height: 80vh; overflow: auto; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #eee; }
        .modal-body { padding: 16px; }
        .close-btn { background: transparent; border: none; font-size: 20px; cursor: pointer; }
        .modal-spinner { width: 22px; height: 22px; border: 2px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 0.8s linear infinite; }
    </style>
</head>
<body>
    <h1>Search</h1>
    <div class="form">
        <label>Title:</label>
        <input id="title" type="text" placeholder="Enter movie title" />
        <label>Type:</label>
        <select id="type">
            <option value="">Any</option>
            <option value="movie">Movie</option>
            <option value="series">Series</option>
            <option value="episode">Episode</option>
        </select>
        <button id="searchBtn">Search</button>
    </div>

    <div id="status" class="status"></div>
    <div id="results" class="results"></div>

    <div class="controls">
        <button id="moreBtn" class="hidden">More</button>
        <div id="listSpinner" class="spinner"></div>
    </div>

    <div id="details" class="details"></div>

    <div id="modalBackdrop" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <div id="modalTitle"></div>
                <button id="modalClose" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div id="modalLoading" style="display:flex;align-items:center;gap:8px;">
                    <div class="modal-spinner"></div>
                    <div>Loading...</div>
                </div>
                <div id="modalContent" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        class MovieService {
            constructor(apiKey) { this.api = 'https://www.omdbapi.com/'; this.key = apiKey }
            async search(title, type, page) {
                const p = new URLSearchParams({ apikey: this.key, s: title, page })
                if (type) p.set('type', type)
                const r = await fetch(`${this.api}?${p}`)
                return await r.json()
            }
            async getMovie(id) {
                const p = new URLSearchParams({ apikey: this.key, i: id, plot: 'full' })
                const r = await fetch(`${this.api}?${p}`)
                return await r.json()
            }
        }

        const svc = new MovieService('2ded05c8')
        const state = { title: '', type: '', page: 1, total: 0, loadingList: false, loadingMore: false }

        const titleInput = document.getElementById('title')
        const typeSelect = document.getElementById('type')
        const searchBtn = document.getElementById('searchBtn')
        const statusBox = document.getElementById('status')
        const resultsBox = document.getElementById('results')
        const moreBtn = document.getElementById('moreBtn')
        const listSpinner = document.getElementById('listSpinner')
        const detailsBox = document.getElementById('details')
        const modalBackdrop = document.getElementById('modalBackdrop')
        const modalTitle = document.getElementById('modalTitle')
        const modalContent = document.getElementById('modalContent')
        const modalLoading = document.getElementById('modalLoading')
        const modalClose = document.getElementById('modalClose')

        function setStatus(t) { statusBox.textContent = t || '' }
        function showSpinnerList(show) { listSpinner.style.display = show ? 'inline-block' : 'none' }
        function toggleMore(show) { moreBtn.classList.toggle('hidden', !show) }
        function resetResults() { resultsBox.innerHTML = ''; detailsBox.innerHTML = '' }
        function renderItems(items) {
            items.forEach(item => {
                const card = document.createElement('div')
                card.className = 'movie'
                const img = document.createElement('img')
                img.src = item.Poster && item.Poster !== 'N/A' ? item.Poster : ''
                img.alt = item.Title
                const ttl = document.createElement('div')
                ttl.className = 'movie-title'
                ttl.textContent = `${item.Title} (${item.Year})`
                const btn = document.createElement('button')
                btn.textContent = 'Details'
                btn.onclick = () => openDetails(item.imdbID, item.Title)
                card.appendChild(img)
                card.appendChild(ttl)
                card.appendChild(btn)
                resultsBox.appendChild(card)
            })
        }

        async function doSearch(firstPage = 1) {
            const q = titleInput.value.trim()
            const t = typeSelect.value
            if (!q) { setStatus(''); resetResults(); toggleMore(false); return }
            state.title = q; state.type = t; state.page = firstPage
            setStatus('Films:')
            state.loadingList = true
            showSpinnerList(true)
            toggleMore(false)
            resetResults()
            const res = await svc.search(state.title, state.type, state.page)
            showSpinnerList(false)
            state.loadingList = false
            if (res.Response === 'False') { resultsBox.innerHTML = '<div>Movie not found!</div>'; return }
            state.total = parseInt(res.totalResults || '0', 10)
            renderItems(res.Search || [])
            const totalPages = Math.ceil(state.total / 10)
            toggleMore(totalPages > state.page)
        }

        async function loadMore() {
            if (state.loadingMore) return
            const totalPages = Math.ceil(state.total / 10)
            if (state.page >= totalPages) { toggleMore(false); return }
            state.page += 1
            moreBtn.disabled = true
            showSpinnerList(true)
            state.loadingMore = true
            const res = await svc.search(state.title, state.type, state.page)
            showSpinnerList(false)
            state.loadingMore = false
            moreBtn.disabled = false
            if (res.Response === 'False') { toggleMore(false); return }
            renderItems(res.Search || [])
            toggleMore(state.page < totalPages)
        }

        function openModal() { modalBackdrop.style.display = 'flex' }
        function closeModal() { modalBackdrop.style.display = 'none'; modalContent.innerHTML = ''; modalContent.style.display = 'none'; modalLoading.style.display = 'flex'; modalTitle.textContent = '' }

        async function openDetails(id, title) {
            openModal()
            modalTitle.textContent = title || 'Details'
            modalLoading.style.display = 'flex'
            modalContent.style.display = 'none'
            const d = await svc.getMovie(id)
            modalLoading.style.display = 'none'
            modalContent.style.display = 'block'
            modalContent.innerHTML = `
            <div style="display:flex;gap:20px;align-items:flex-start;">
                ${d.Poster && d.Poster !== 'N/A' ? `<img src="${d.Poster}" alt="Poster" style="width:180px;height:auto;object-fit:cover;border:1px solid #ccc;">` : ''}
                <div style="flex:1;">
                    <div><b>Title:</b> ${d.Title || 'n/a'}</div>
                    <div><b>Released:</b> ${d.Released || 'n/a'}</div>
                    <div><b>Genre:</b> ${d.Genre || 'n/a'}</div>
                    <div><b>Country:</b> ${d.Country || 'n/a'}</div>
                    <div><b>Director:</b> ${d.Director || 'n/a'}</div>
                    <div><b>Writers:</b> ${d.Writer || 'n/a'}</div>
                    <div><b>Actors:</b> ${d.Actors || 'n/a'}</div>
                    <div><b>Awards:</b> ${d.Awards || 'n/a'}</div>
                    <div style="margin-top:8px;">${d.Plot || ''}</div>
                </div>
            </div>
        `
        }

        searchBtn.onclick = () => doSearch(1)
        moreBtn.onclick = () => loadMore()
        modalClose.onclick = () => closeModal()
        modalBackdrop.onclick = e => { if (e.target === modalBackdrop) closeModal() }
    </script>
</body>
</html>
